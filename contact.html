<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Portfolio</title>
<meta name="description" content="Get in touch about teaching, design or leading change.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<script src="main.js" defer></script>
</head>
<body data-page="contact" data-root="">
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <section class="band-tape" style="padding:clamp(4rem,9vw,7rem) 0">
    <div class="wrap contact-grid">
      <div>
        <h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">Let's talk about teaching, design or leading change.</h1>
        <p style="font-size:1.2rem;margin-top:1.2rem">I am happy to share templates, swap ideas or hear how you tackled something similar.</p>
      </div>
      <div>
        <!-- EDIT: your real details -->
        <ul class="contact-list">
          <li><span>Email</span><a href="mailto:you@example.com">you@example.com</a></li>
          <li><span>LinkedIn</span><a href="https://www.linkedin.com/in/your-profile" target="_blank" rel="noopener">linkedin.com/in/your-profile</a></li>
          <li><span>Based in</span>Hyderabad, India</li>
        </ul>
        <div class="actions" style="margin-top:0">
          <a class="btn solid" href="mailto:you@example.com">Send an email</a>
          <button class="btn line" type="button" data-copy="you@example.com">Copy my email</button>
          <a class="btn line" href="files/cv.pdf" download>Download my CV</a>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
</body>
</html>
